<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0e0c">
<title>Cgharbi X SES · Bac 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#0b0e0c;--ink2:#131713;--ink3:#1a201b;--ink4:#222a23;--ink5:#2c352d;--ink6:#374338;
  --lime:#b8f59a;--lime2:#d0fbb8;--lime-d:#8dd066;
  --gold:#f5c842;--gold2:#ffd968;--coral:#ff7a5c;--coral2:#ff9a82;
  --sky:#7ec8f0
}
body{background:var(--ink);color:#fff;font-family:'Plus Jakarta Sans',sans-serif;overflow-x:hidden}
.top-nav-minimal{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--ink);border-bottom:1px solid var(--ink3);font-size:0.75rem;letter-spacing:0.5px}
.nav-link-hggsp{color:var(--lime);text-decoration:none;display:flex;align-items:center;gap:6px;transition:opacity 0.2s;font-weight:600}
.nav-link-hggsp:hover{opacity:0.8}.nav-link-hggsp::before{content:"";width:6px;height:6px;background:var(--gold);border-radius:50%}
.minimal-timer{color:var(--gold);font-family:"JetBrains Mono",monospace;opacity:0.9}

/* GUIDE STYLES */
.g-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:10000;display:none;backdrop-filter:blur(4px)}
.g-overlay.active{display:block}
.g-step{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10001;background:var(--ink2);border:1px solid var(--lime);padding:30px;border-radius:20px;width:90%;max-width:400px;display:none;box-shadow:0 0 40px rgba(0,0,0,0.8);text-align:center}
.g-step.active{display:block}
.g-step h3{color:var(--lime);font-family:"Fraunces",serif;margin-bottom:12px;font-size:1.5rem}
.g-step p{color:#fff;opacity:0.8;font-size:0.9rem;line-height:1.5;margin-bottom:20px}
.g-step b{color:var(--gold)}
.g-btn-next{background:var(--lime);color:var(--ink);border:none;padding:12px 25px;border-radius:10px;font-weight:800;cursor:pointer;width:100%;transition:transform 0.2s}
.g-btn-next:hover{transform:scale(1.02)}
.g-progress{display:flex;justify-content:center;gap:8px;margin-bottom:15px}
.g-dot{width:8px;height:8px;background:var(--ink4);border-radius:50%}
.g-dot.active{background:var(--lime)}
</style>
</head>
<body>

<nav class="top-nav-minimal">
  <a href="https://cgharbi77130.github.io/Hggsp-X-Cgharbi-AI/" class="nav-link-hggsp">HGGSP X CGHARBI</a>
  <div class="minimal-timer" id="min-timer"></div>
</nav>

<div id="tour-overlay" class="g-overlay"></div>
<div id="tour-card" class="g-step">
  <div class="g-progress" id="g-dots"></div>
  <h3 id="t-title"></h3>
  <p id="t-text"></p>
  <button class="g-btn-next" onclick="nextT()" id="t-btn">Suivant</button>
</div>

<!-- Le reste de votre contenu HTML original ici -->

<script>
// TIMER
const target=new Date("June 16, 2026 08:00:00").getTime();
setInterval(()=>{
  const n=new Date().getTime();
  const d=target-n;
  const days=Math.floor(d/(1000*60*60*24));
  const hrs=Math.floor((d%(1000*60*60*24))/(1000*60*60));
  const mins=Math.floor((d%(1000*60*60))/(1000*60));
  document.getElementById("min-timer").innerHTML=days+"j "+hrs+"h "+mins+"m";
},1000);

// TOUR
let tIdx=0;
const tSteps=[
  {t:"Le Concept",txt:"Bienvenue sur <b>Cgharbi X SES</b>. Un espace conçu pour réviser le Bac 2026 avec efficacité."},
  {t:"Switch HGGSP",txt:"Le bouton en haut à gauche vous permet de basculer vers vos fiches <b>Géo-po</b> en un clic."},
  {t:"Chrono Live",txt:"Le timer en haut à droite suit l'échéance du <b>mardi 16 juin</b>. Ne perdez pas une seconde !"},
  {t:"Navigation",txt:"Faites défiler la page pour explorer les chapitres. Tout est pensé pour une lecture fluide."}
];

function updateT(){
  const s=tSteps[tIdx];
  document.getElementById("t-title").innerHTML=s.t;
  document.getElementById("t-text").innerHTML=s.txt;
  document.getElementById("t-btn").innerHTML=tIdx===tSteps.length-1?"C'est parti !":"Suivant";
  let dots="";
  for(let i=0;i<tSteps.length;i++) dots+="<div class='g-dot "+(i===tIdx?"active":"")+"'></div>";
  document.getElementById("g-dots").innerHTML=dots;
}

function nextT(){
  tIdx++;
  if(tIdx<tSteps.length) updateT();
  else {
    document.getElementById("tour-overlay").classList.remove("active");
    document.getElementById("tour-card").classList.remove("active");
    localStorage.setItem("tour-v3-done","true");
  }
}

window.onload=()=>{
  if(!localStorage.getItem("tour-v3-done")){
    setTimeout(()=>{
      document.getElementById("tour-overlay").classList.add("active");
      document.getElementById("tour-card").classList.add("active");
      updateT();
    },500);
  }
}
</script>
</body>
</html>
